name: Wolf Jansen News Bot

on:
  schedule:
    # Hourly, around the clock, at an off-peak minute. GitHub creates
    # scheduled runs anywhere from 1 to 12 hours late (the old 07:00 slot was
    # landing at 1:30-4pm UK in September, and 7-8pm in late August), so a
    # single morning slot cannot work. run_guard.py lets exactly one run per
    # weekday deliver: the first inside the 07:00-12:00 UK window. All the
    # others stand down in seconds without touching the feeds.
    - cron: '17 * * * *'
  workflow_dispatch:          # Allow manual "Run workflow" from GitHub UI

# Delayed runs can arrive in a bunch. Run them one at a time, so the second
# sees the first's delivery record and stands down instead of sending twice.
concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Needed to commit seen_stories.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic==0.125.0 requests python-dotenv

      - name: Run news bot
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:          smtp.gmail.com
          SMTP_PORT:          "587"
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          PA_APPROVE_URL:     ${{ secrets.PA_APPROVE_URL }}
          PA_REJECT_URL:      ${{ secrets.PA_REJECT_URL }}
          WP_URL:             https://wolfjansen.com
          WP_USER:            ${{ secrets.WP_USER }}
          WP_APP_PASSWORD:    ${{ secrets.WP_APP_PASSWORD }}
          MS_TENANT_ID:       ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:   ${{ secrets.MS_CLIENT_SECRET }}
          MS_USER_EMAIL:      ${{ secrets.MS_USER_EMAIL }}
          # run_guard.py reads/writes last_delivery.json through the API.
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
        run: python news_bot.py

      - name: Commit updated seen_stories.json
        run: |
          git config user.name  "WJ News Bot"
          git config user.email "bot@wolfjansen.com"
          git add seen_stories.json
          git diff --staged --quiet || git commit -m "chore: update seen stories [skip ci]"
          git pull --rebase origin main
          git push
