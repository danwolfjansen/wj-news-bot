<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Wolf Jansen — Approve post</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 { color: #1a1a1a; font-size: 22px; margin: 0 0 12px; }
    p  { color: #666; font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
    button {
      margin-top: 20px;
      padding: 14px 32px;
      background: #1a6b3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .small { font-size: 12px; color: #999; margin-top: 16px; }
    .small a { color: #999; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Approving post…</h1>
    <p  id="msg">Please wait a moment.</p>
    <button id="go" class="hidden">Try again</button>
    <p class="small hidden" id="note"></p>
  </div>

  <script>
    // ONE-CLICK APPROVAL: the webhook fires automatically when this page
    // opens from the email link. Duplicate protection comes from two layers:
    // (1) the news bot pre-creates the WordPress draft, so approval is an
    //     idempotent publish of an existing post_id (repeat fires re-publish
    //     the same post, they cannot create a second one);
    // (2) localStorage remembers a used link per device, so a reload or
    //     re-tap shows 'Already actioned' instead of firing again.
    // The button below only appears as a retry fallback after an error, or
    // as the manual 'run it again' path on an already-used link.
    const params  = new URLSearchParams(window.location.search);
    const encoded = params.get('url');
    const token   = params.get('token');
    const btn     = document.getElementById('go');
    const note    = document.getElementById('note');

    function show(icon, title, msg) {
      document.getElementById('icon').textContent  = icon;
      document.getElementById('title').textContent = title;
      document.getElementById('msg').textContent   = msg;
    }

    function fire() {
      btn.disabled = true;
      btn.classList.add('hidden');
      note.classList.add('hidden');
      show('⏳', 'Approving post…', 'Please wait a moment.');
      const postId = params.get('post_id') || '';
      let paUrl = atob(encoded) + '&token=' + encodeURIComponent(token);
      if (postId) paUrl += '&post_id=' + encodeURIComponent(postId);
      fetch(paUrl, { method: 'GET', mode: 'no-cors' })
        .then(() => {
          try { localStorage.setItem('wj-done-' + token, '1'); } catch (e) {}
          show('✅', 'Post approved', 'The post has been sent to the Wolf Jansen website.');
        })
        .catch(() => {
          btn.disabled = false;
          btn.textContent = 'Try again';
          show('❌', 'Something went wrong', 'Tap the button to try again.');
          btn.classList.remove('hidden');
        });
    }

    if (!encoded || !token) {
      show('❌', 'Invalid link', 'This link is missing required information.');
    } else {
      let done = false;
      try { done = localStorage.getItem('wj-done-' + token) === '1'; } catch (e) {}
      if (done) {
        show('✅', 'Already actioned', 'This link was already used on this device.');
        note.innerHTML = 'If the first attempt failed, you can <a href="#" id="again">run it again</a>.';
        note.classList.remove('hidden');
        document.getElementById('again').addEventListener('click', function (e) {
          e.preventDefault();
          fire();
        });
      } else {
        btn.addEventListener('click', fire);
        fire();
      }
    }
  </script>
</body>
</html>
